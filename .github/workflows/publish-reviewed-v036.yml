name: Publish reviewed recipient handoff v036
on:
  push:
    branches: [release/external-v0.3.6]
    paths: [.github/workflows/publish-reviewed-v036.yml]
permissions:
  contents: write
jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_TREE: f9e403b6426b5dd3ef910998036219b3f22f4881
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact reviewed source, preserving both prior releases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:external-eval/v0.3.5)" = 87105481796d5e47818237011e9a684f91e5404e
          mkdir external-eval/v0.3.6
          git archive HEAD:external-eval/v0.3.5 | tar -x -C external-eval/v0.3.6
          python - <<'PY'
          import base64,hashlib,io,lzma,pathlib,tarfile
          raw=base64.b64decode(''.join(pathlib.Path(f'.delivery/v036-part{i}.b64').read_text().strip() for i in range(1,4)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='823378012881356684138cdd7e6da39c6b1581087fc1cb9f4e5fdcd946e9db54','TRANSFER_BYTES_MISMATCH'
          content=lzma.decompress(raw);assert len(content)<2000000
          root=pathlib.Path('external-eval/v0.3.6')
          with tarfile.open(fileobj=io.BytesIO(content)) as t:
              entries=t.getmembers();assert len(entries)==21 and len({x.name for x in entries})==21
              for item in entries:
                  path=pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts and '.github' not in path.parts
                  dest=root.joinpath(*path.parts);dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(t.extractfile(item).read());dest.chmod(0o644)
          PY
          python external-eval/v0.3.6/scripts/source_manifest.py
          echo 'a71114bf36995487ed7dc809f8831cd0b0b2ba1ae0c285acda8186227a912619  external-eval/v0.3.6/SOURCE_MANIFEST.json' | sha256sum -c -
          python external-eval/v0.3.6/scripts/verify_source_manifest.py
          git add external-eval/v0.3.6
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:external-eval/v0.3.6")" = "$EXPECTED_TREE"
      - name: Install actual package and test mapping and isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest jsonschema
          python -m pip install --no-deps ./external-eval/v0.3.6
          mkdir -p external-eval/review-v0.3.6-ci
          cd external-eval/v0.3.6
          python -m pytest -q tests/test_third_party_review.py tests/test_v035_recipient_audit.py tests/test_publication_merge_guards.py tests/test_external_rcc.py --junitxml=../review-v0.3.6-ci/tests.xml
      - name: Run a new recipient using only the installed package
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/external-eval/review-v0.3.6-ci"
          cd /tmp
          python -I -m rveval init-pilot --name 'Independent recipient' --output-dir "$RUNNER_TEMP/new-pilot" > "$evidence/init.json"
          cd "$RUNNER_TEMP/new-pilot"
          python -I -m rveval mapping-check --contract contracts/mapping.json > "$evidence/mapping.json"
          python -I -m rveval freeze --config config.json --output freeze.json > "$evidence/freeze.json"
          python -I -m rveval run --config config.json --freeze freeze.json --ack-freeze-sha256 "$(python -I -m rveval hash freeze.json)" --output-dir run-001 > "$evidence/run.json"
          python -I -m rveval verify --run-dir run-001 --expected-index-sha256 "$(python -I -m rveval hash run-001/evidence_index.json)" > "$evidence/verify.json"
          python -I - <<'PY'
          from pathlib import Path
          from rveval.recipient import validate_partner_bindings
          from rveval.readiness import assess_profile
          assert validate_partner_bindings(Path('contracts/partner_bindings.json'))['status']=='NOT_READY'
          assert assess_profile(Path('templates/native_component_profile.json'))['status']=='NOT_READY'
          assert Path('docs/PARTNER_START_HERE.md').is_file()
          assert Path('docs/PARTNER_IMPLEMENTATION.md').is_file()
          PY
          cp -R run-001 "$evidence/pilot-run"
      - name: Verify evidence and publish the tested source
        shell: bash
        run: |
          set -euo pipefail
          python external-eval/v0.3.6/scripts/verify_source_manifest.py
          python - <<'PY'
          import pathlib,json,hashlib,os
          from xml.etree import ElementTree as E
          root=pathlib.Path('external-eval/review-v0.3.6-ci')
          suites=list(E.parse(root/'tests.xml').iter('testsuite'))
          counts={k:sum(int(x.get(k,0)) for x in suites) for k in ('tests','errors','failures','skipped')}
          assert counts['tests']>0 and all(counts[k]==0 for k in ('errors','failures','skipped'))
          assert json.loads((root/'run.json').read_text())['status']=='COMPLETED'
          refs=[{'path':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          result={'status':'PASS','version':'0.3.6','scope':'REMOTE_TESTED_SOURCE_AND_INSTALLED_RECIPIENT_HANDOFF','source_tree':os.environ['EXPECTED_TREE'],'base_source_tree':'87105481796d5e47818237011e9a684f91e5404e','ci_tests':counts,'local_native_suite_tests':352,'local_native_result_reexecuted_by_this_ci':False,'installed_new_pilot':'COMPLETED_AND_VERIFIED','unfilled_native_profile':'NOT_READY_AS_EXPECTED','all_benchmarks_executed':False,'paid_model_calls':False,'github_run_id':os.environ['GITHUB_RUN_ID'],'evidence':refs}
          (root/'verification.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          printf '%s\n' '# Current external evaluation kit' '' 'Reviewed release: [0.3.6](external-eval/v0.3.6/README.md).' '' '[Partner start](external-eval/v0.3.6/docs/PARTNER_START_HERE.md) | [Implementation and recipient mapping](external-eval/v0.3.6/docs/PARTNER_IMPLEMENTATION.md) | [Remote verification](external-eval/review-v0.3.6-ci/verification.json).' '' 'Earlier release source and historical results are preserved. New native APIs require explicit adapters and their own execution evidence.' > EXTERNAL_EVALUATION_KIT.md
          git rm .delivery/v036-part1.b64 .delivery/v036-part2.b64 .delivery/v036-part3.b64
          git add external-eval/v0.3.6 external-eval/review-v0.3.6-ci EXTERNAL_EVALUATION_KIT.md
          tree=$(git write-tree)
          test "$(git rev-parse "$tree:external-eval/v0.3.6")" = "$EXPECTED_TREE"
          git config user.name 'Ben Bae'
          git config user.email '224881116+effacermonexistence@users.noreply.github.com'
          git commit -m 'release: publish tested recipient isolation and mapping handoff v0.3.6'
          git push origin HEAD:refs/heads/release/external-v0.3.6
          git rev-parse HEAD > /tmp/published-v036-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v036-publication-readback
          path: |
            external-eval/v0.3.6/
            external-eval/review-v0.3.6-ci/
          retention-days: 30
          if-no-files-found: error
