name: Repair RCC canonical publication v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-rcc-publication-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rcc-publication-repair-v2
  cancel-in-progress: false

jobs:
  restore-verified-source:
    if: github.repository == 'effacermonexistence/rcc-revas-veritas-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional schema-test dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Recover exact bytes, validate original tree and tests, publish, read back
        id: repair
        env:
          RCC_ARCHIVE_TRANSPORT_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-7cb0-81f8-bee0-9c7b889b25f7/raw?se=2026-09-22T07%3A09%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=ee8ea561-0ea3-5073-b255-ef34ac1adf85&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T02%3A08%3A20Z&ske=2026-09-23T02%3A08%3A20Z&sks=b&skv=2026-02-06&sig=H/aXbNNv4pdVOrxV1BIDl/G91FO32XQoADGtIGMrNOw%3D'
        run: python scripts/repair_rcc_publication_v2.py
      - name: Retain actual repair and reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcc-publication-repair-v2-evidence
          path: ${{ runner.temp }}/rcc-repair-${{ github.run_id }}/
          if-no-files-found: error
