name: Typed identity recheck v039
on:
  push:
    branches: [release/external-v0.3.9]
    paths: [.github/workflows/recheck-typed-v039.yml]
permissions:
  contents: write
jobs:
  recheck-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SRC: external-eval/v0.3.9
      BASE: 85224ecfd965f7aff6c3d5d8a772f49c17db717c
      EXPECTED_TREE: 97fb30ef5a41e4bf92cf9d050ae49cd4290d66f2
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and bind exact tested source
        run: |
          set -euo pipefail
          mkdir -p review-output
          python - <<'PY'
          import pathlib,subprocess,tarfile,io,os,json,hashlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'v038';base.mkdir()
          raw=subprocess.check_output(['git','archive',os.environ['BASE']+':external-eval/v0.3.8'])
          with tarfile.open(fileobj=io.BytesIO(raw)) as t:t.extractall(base,filter='data')
          subprocess.run(['python','.audit/v039/reconstruct.py','--base',str(base),'--output',os.environ['SRC'],'--assets','.audit/v039'],check=True)
          subprocess.run(['git','add',os.environ['SRC']],check=True)
          actual=subprocess.check_output(['git','write-tree','--prefix='+os.environ['SRC']+'/'],text=True).strip()
          assert actual==os.environ['EXPECTED_TREE'],actual
          manifest=pathlib.Path(os.environ['SRC'])/'SOURCE_MANIFEST.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='700dd37dedb7905c5bc61f5457fe9fdca16b1aeadd6e7f6021cf8a4151e2805d'
          pathlib.Path('review-output/source.json').write_text(json.dumps({'base':os.environ['BASE'],'source_tree':actual,'files':218},indent=2)+'\n')
          PY
      - name: Install declared native dependencies and actual package
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install -r "$SRC/requirements-native.txt"
          python -m pip install "$SRC[test]"
          python -m pip check > review-output/pip-check.txt
          node --version > review-output/node-version.txt
      - name: Fetch exact native source pins without model credentials
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,os
          pins=json.loads((pathlib.Path(os.environ['SRC'])/'SOURCES_NATIVE.json').read_text())['repositories']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'native';root.mkdir()
          for name,pin in pins.items():
              target=root/name;target.mkdir()
              commands=[['git','init',str(target)],['git','-C',str(target),'remote','add','origin','https://github.com/'+pin['repository']+'.git'],['git','-C',str(target),'fetch','--depth=1','origin',pin['commit']],['git','-C',str(target),'checkout','--detach','FETCH_HEAD']]
              for command in commands:subprocess.run(command,check=True,timeout=180)
              assert subprocess.check_output(['git','-C',str(target),'rev-parse','HEAD'],text=True).strip()==pin['commit']
          pathlib.Path('review-output/native-pins.json').write_text(json.dumps(pins,indent=2)+'\n')
          PY
      - name: Execute all tests and real-data profiles
        run: |
          set -euo pipefail
          python "$SRC/scripts/validate_native.py" \
            --rcc-source "$RUNNER_TEMP/native/rcc/rcc-revas-eval/v0.1.0/runtime" \
            --veritas-source "$RUNNER_TEMP/native/veritas" \
            --agentdojo-source "$RUNNER_TEMP/native/agentdojo" \
            --tau-source "$RUNNER_TEMP/native/tau" \
            --tau2-source "$RUNNER_TEMP/native/tau2" \
            --output "$GITHUB_WORKSPACE/review-output/native" > review-output/native-console.log 2>&1
      - name: Execute reference families and installed recipient
        run: |
          set -euo pipefail
          python "$SRC/scripts/run_acceptance.py" --skip-tests --output "$GITHUB_WORKSPACE/review-output/reference" > review-output/reference-console.log 2>&1
          cd "$RUNNER_TEMP"
          python -I -m rveval init-pilot --name new-partner-v039 --output-dir ./new-partner-v039 > "$GITHUB_WORKSPACE/review-output/pilot-init.json"
          cd new-partner-v039
          test -f docs/PARTNER_START_HERE.md
          python -I -m rveval mapping-check --contract contracts/mapping.json > "$GITHUB_WORKSPACE/review-output/pilot-mapping.json"
          python -I -m rveval freeze --config config.json --output freeze.json
          python -I -m rveval run --config config.json --freeze freeze.json --ack-freeze-sha256 "$(python -I -m rveval hash freeze.json)" --output-dir run > "$GITHUB_WORKSPACE/review-output/pilot-run.json"
          python -I -m rveval verify --run-dir run --expected-index-sha256 "$(python -I -m rveval hash run/evidence_index.json)" > "$GITHUB_WORKSPACE/review-output/pilot-verify.json"
          cp -r run "$GITHUB_WORKSPACE/review-output/installed-pilot-run"
      - name: Require full passing evidence and unchanged source
        run: |
          set -euo pipefail
          python "$SRC/scripts/verify_source_manifest.py" > review-output/source-after.json
          python - <<'PY'
          import json,pathlib,os,hashlib,subprocess
          root=pathlib.Path('review-output')
          native=json.loads((root/'native/validation.json').read_text())
          reference=json.loads((root/'reference/acceptance.json').read_text())
          assert native['status']=='PASS' and native['test_counts']=={'tests':444,'failures':0,'errors':0,'skipped':0},native
          assert reference['status']=='PASS' and len(reference['commands'])==30 and not reference['skips'],reference
          assert json.loads((root/'pilot-run.json').read_text())['status']=='COMPLETED'
          assert json.loads((root/'pilot-verify.json').read_text())['status']=='PASS'
          subprocess.run(['git','add',os.environ['SRC']],check=True)
          actual=subprocess.check_output(['git','write-tree','--prefix='+os.environ['SRC']+'/'],text=True).strip()
          assert actual==os.environ['EXPECTED_TREE']
          report={'status':'PASS','version':'0.3.9','scope':'TYPED_IDENTITY_AND_NATIVE_IMPLEMENTATION_RECHECK','source_tree':actual,'input_commit':os.environ['BASE'],'workflow_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'native_tests':native['test_counts'],'reference_cli_commands':30,'installed_partner':'COMPLETED_AND_VERIFIED','source_unchanged':True,'real_data_profiles':3,'all_task_model_sweeps_executed':False,'bug_freedom_proven':False,'paid_model_calls':False,'provider_mode':'CONTROLLED_NATIVE_INTEGRATION_TRANSCRIPT'}
          report['evidence']=[{'path':str(f.relative_to(root)),'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in sorted(root.rglob('*')) if f.is_file()]
          (root/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish only fully tested source on the new branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p external-eval/review-v0.3.9
          cp review-output/verification.json review-output/source.json external-eval/review-v0.3.9/
          cp review-output/native/tests.xml external-eval/review-v0.3.9/tests.xml
          git add external-eval/v0.3.9 external-eval/review-v0.3.9
          git config user.name 'Ben Bae'
          git config user.email '224881116+effacermonexistence@users.noreply.github.com'
          git commit -m 'release: v0.3.9 typed identity corrections after full native and installed-partner recheck'
          gh auth setup-git
          git push origin HEAD:release/external-v0.3.9
          git rev-parse HEAD > review-output/published-commit.txt
          python - <<'PY'
          import zipfile,pathlib,os
          root=pathlib.Path(os.environ['SRC'])
          with zipfile.ZipFile('review-output/published-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and not any(x in {'__pycache__','.pytest_cache'} or x.endswith('.egg-info') for x in p.relative_to(root).parts):z.write(p,p.relative_to(root))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v039-full-recheck
          path: review-output/
          retention-days: 30
          if-no-files-found: error
