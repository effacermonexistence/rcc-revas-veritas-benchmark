name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install both suites' test dependencies
        run: python -m pip install pytest jsonschema==4.25.1
      - run: python -m py_compile run_joint_benchmark.py tests/test_runner.py
      - run: python run_joint_benchmark.py --self-check
      - name: Run legacy benchmark pytest suite
        # The newly published runtime is an independent unittest project.
        # Unbounded pytest discovery treats its dynamic method factory as a
        # top-level pytest fixture request. Run both complete suites explicitly.
        run: python -m pytest -q tests
      - name: Run all canonical RCC runtime tests with their native runner
        working-directory: rcc-revas-eval/v0.1.0/runtime
        run: python -m unittest discover -s tests -t . -v
