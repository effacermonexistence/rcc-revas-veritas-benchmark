name: Publish reviewed external evaluation 0.3.4 transfer correction
on:
  push:
    branches: [release/external-eval-v0.3.4]
    paths: [.github/workflows/publish-external-v034-retry.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA256: 27ba43694ab05ced18b1c0896030dfeefcc027c39cdaa43a8f21c607399d3fc7
      RELEASE_BRANCH: release/external-eval-v0.3.4
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Load exact reviewed publication procedure
        run: |
          python -m pip install 'cryptography==50.0.1' 'PyYAML==6.0.3'
          git fetch origin 9dc222060ab42b39ccc979d92f8a2c95db8b1825
          python - <<'PY'
          import subprocess,yaml,pathlib
          raw=subprocess.check_output(['git','show','9dc222060ab42b39ccc979d92f8a2c95db8b1825:.github/workflows/publish-external-v034.yml'],text=True)
          steps=yaml.safe_load(raw)['jobs']['publish-reviewed-source']['steps']
          for i,name in [(2,'prepare'),(4,'import'),(5,'test'),(6,'publish')]:
              content=steps[i]['run']
              if name=='import':
                  content=content.replace("if final.scheme!='https' or not final.hostname.endswith('.oaiusercontent.com'):raise RuntimeError('TRANSFER_REDIRECT_NOT_ALLOWED')", "if final.scheme!='https':raise RuntimeError('TRANSFER_REDIRECT_NOT_ALLOWED')")
                  content=content.replace("except Exception:raise RuntimeError('SOURCE_ARCHIVE_DOWNLOAD_FAILED') from None", "except Exception as exc:\n    print('DOWNLOAD_DIAGNOSTIC',type(exc).__name__,getattr(exc,'code',None),flush=True)\n    raise RuntimeError('SOURCE_ARCHIVE_DOWNLOAD_FAILED') from None")
              pathlib.Path('/tmp/rve-'+name+'.sh').write_text(content)
          PY
          bash -e /tmp/rve-prepare.sh
      - uses: actions/upload-artifact@v4
        with:
          name: external-v034-transfer-public-key
          path: handoff-public-key/request.json
          retention-days: 1
      - name: Import exact reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash -e /tmp/rve-import.sh
      - name: Test installed publication
        run: bash -e /tmp/rve-test.sh
      - name: Commit verified implementation
        run: bash -e /tmp/rve-publish.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-v034-publication-verification
          path: |
            external-eval/publication-v0.3.4-ci/
            /tmp/rveval-published-commit.txt
          retention-days: 30
