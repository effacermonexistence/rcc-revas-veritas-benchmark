[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcc-revas-veritas-external-benchmark"
version = "0.3.4"
description = "Benchmark-agnostic paired evaluation substrate for RCC/REVAS and VERITAS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
tabular = ["scikit-learn==1.8.0", "numpy==2.5.3"]
gym = ["gymnasium==1.3.0"]
lm-eval = ["lm-eval==0.4.13"]
inspect = ["inspect-ai==0.3.268"]
swebench = ["swebench==5.0.2"]
crypto = ["cryptography==50.0.1"]

[project.scripts]
rveval = "rveval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"rveval.resources" = ["*.json", "*.md", "*.txt"]
