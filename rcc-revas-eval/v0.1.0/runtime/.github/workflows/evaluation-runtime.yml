name: RCC scoped runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-subset:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/reproduce_review.py --output-dir output/ci
